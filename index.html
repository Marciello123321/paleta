<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#202c33" />
  <meta name="color-scheme" content="dark light" />

  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="icon" href="plotkarki.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="plotkarki-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Plotkarki" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <!-- Ikony -->

      <symbol id="i-camoff" viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="3.2"/><path d="M15.5 10.5l5-3v9l-5-3zM3 3l18 18"/></symbol>
      <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="2.5"/><path d="M8 20.5h8M12 16.5v4M12 13V7.8M9.6 10l2.4-2.4 2.4 2.4"/></symbol>

      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21.5 2.5L10.5 13.5M21.5 2.5l-7 19-4-8.5-8.5-4z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5L16 16"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-notebook" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.8"/><path d="M9 3v18M12.5 8h3.5M12.5 12h3.5"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 11.5a7.5 7.5 0 01-10.9 6.7L4 19.5l1.4-4.6A7.5 7.5 0 1120.5 11.5z"/></symbol>
      <symbol id="i-userplus" viewBox="0 0 24 24"><circle cx="9.5" cy="8" r="3.6"/><path d="M3 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M19 8v6M16 11h6"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.3"/><path d="M2.5 19.5c0-3.3 2.8-5.5 6.5-5.5s6.5 2.2 6.5 5.5M16 4.8a3.3 3.3 0 010 6.4M18.5 14.4c2 .7 3.2 2.5 3.2 5.1"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></symbol>
      <symbol id="i-micoff" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M3 3l18 18"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0113.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 01-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></symbol>
      <symbol id="i-tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-ticks" viewBox="0 0 24 24"><path d="M2 12.5l4.5 4.5L16 7.5M10.5 15.5l1.5 1.5 9.5-9.5"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l1.5 2h-15zM10 20.5a2 2 0 004 0"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 16l-4-4 4-4M6 12h10"/></symbol>

      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-vibrate" viewBox="0 0 24 24"><rect x="8" y="4" width="8" height="16" rx="2"/><path d="M4 9v6M20 9v6"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></symbol>
      <symbol id="i-belloff" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 019.5-4.9M18 11v5l1.5 2H8M10 20.5a2 2 0 004 0M3 3l18 18"/></symbol>

      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></symbol>
      <symbol id="i-hangup" viewBox="0 0 24 24"><g transform="rotate(135 12 12)"><path fill="currentColor" stroke="none" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></g></symbol>
      <!-- buzka ze słuchawką -->
      <symbol id="i-callface" viewBox="0 0 28 28">
        <circle cx="13" cy="13" r="10.5" fill="#ffd23f"/>
        <circle cx="9.4" cy="11.2" r="1.4" fill="#3b2a00" stroke="none"/>
        <circle cx="16.6" cy="11.2" r="1.4" fill="#3b2a00" stroke="none"/>
        <path d="M8.6 15.2q4.4 3.9 8.8 0" fill="none" stroke="#3b2a00" stroke-width="1.7" stroke-linecap="round"/>
        <circle cx="21.2" cy="21.2" r="6.4" fill="#22c55e" stroke="#16131f" stroke-width="1.4"/>
        <g transform="translate(15.7 15.7) scale(.46)"><path fill="#fff" stroke="none" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></g>
      </symbol>
      <symbol id="i-logo" viewBox="0 0 512 512">
        <defs><linearGradient id="lgbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4f9a"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
        <rect width="512" height="512" rx="116" fill="url(#lgbg)"/>
        <path d="M256 112c-96 0-172 62-172 140 0 44 24 83 62 109l-13 52c-2 9 8 15 15 10l62-36c15 3 30 5 46 5 96 0 172-62 172-140S352 112 256 112z" fill="#fff"/>
        <ellipse cx="205" cy="250" rx="40" ry="50" fill="#fff" stroke="#2a1440" stroke-width="12"/><ellipse cx="307" cy="250" rx="40" ry="50" fill="#fff" stroke="#2a1440" stroke-width="12"/>
        <circle cx="224" cy="262" r="19" fill="#2a1440"/><circle cx="326" cy="262" r="19" fill="#2a1440"/><circle cx="230" cy="255" r="6" fill="#fff"/><circle cx="332" cy="255" r="6" fill="#fff"/>
        <path d="M410 70l11 26 26 11-26 11-11 26-11-26-26-11 26-11z" fill="#ffd23f"/>
      </symbol>
    </defs>
  </svg>

  <!-- Ekran powitalny: wybór nicka -->
  <div class="welcome" id="welcome" hidden>
    <svg class="ic welcome-logo"><use href="#i-logo"/></svg>
    <h1>Plotkarki</h1>
    <p class="welcome-sub">Czaty, grupki, wspólne notatniki i rozmowy wideo dla twojej ekipy.</p>
    <form id="welcomeForm" class="welcome-form">
      <label for="nickField">Wybierz swój nick</label>
      <input id="nickField" maxlength="16" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="np. kuba_07" />
      <div class="hint">3–16 znaków: litery, cyfry lub podkreślnik (_). Po tym nicku znajomi cię dodadzą.</div>
      <div class="err" id="welcomeErr"></div>
      <button class="primary" type="submit" id="welcomeBtn">Zaczynamy</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <!-- Lewa kolumna: grupki i znajomi -->
    <nav class="rail" id="rail" aria-label="Grupki i czaty">
      <button class="ri add" id="railAdd" aria-label="Dodaj znajomego lub grupkę">
        <span class="tile"><svg class="ic"><use href="#i-plus"/></svg></span><span class="lbl">Dodaj</span>
      </button>
      <div class="rail-sec">Grupki</div>
      <div class="rail-list" id="groupList"></div>
      <div class="rail-sec">Znajomi</div>
      <div class="rail-list" id="chatList"></div>
      <button class="ri me" id="railMe" aria-label="Ustawienia"></button>
    </nav>

    <main class="main">
      <header class="topbar">
        <span class="room-av" id="roomAv"></span>
        <div class="title" id="titleBox">
          <div class="title-name" id="roomName"></div>
          <div class="title-sub" id="roomSub"></div>
        </div>
        <div class="actions" id="roomActions">
          <button class="round call-btn" data-call="audio" aria-label="Zadzwoń"><svg class="ic big"><use href="#i-callface"/></svg></button>
          <button class="round cam-btn" data-call="video" aria-label="Rozmowa wideo"><svg class="ic"><use href="#i-video"/></svg></button>
        </div>
        <button class="round" id="openSettings" aria-label="Ustawienia"><svg class="ic"><use href="#i-sliders"/></svg></button>
      </header>

      <div class="notebooks" id="notebookBar"></div>
      <section class="feed" id="feed" aria-live="polite"></section>

      <button class="to-bottom" id="toBottom" type="button" aria-label="Przewiń na dół" hidden><svg class="ic"><use href="#i-down"/></svg></button>
      <div class="emoji-panel" id="emojiPanel" hidden></div>
      <form class="composer" id="composer">
        <div class="pill">
          <button class="round sm" type="button" id="emojiBtn" aria-label="Emoji"><svg class="ic"><use href="#i-smile"/></svg></button>
          <textarea id="input" rows="1" placeholder="Napisz coś…" enterkeyhint="send"></textarea>
        </div>
        <button class="send" type="submit" aria-label="Wyślij"><svg class="ic"><use href="#i-send"/></svg></button>
      </form>
    </main>
  </div>

  <!-- Dodaj / stwórz -->
  <div class="sheet" id="plus" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><h2>Dodaj</h2><button class="round sm" id="closePlus" aria-label="Zamknij"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <div id="plusBody"></div>
    </div>
  </div>

  <!-- Ustawienia -->
  <div class="page" id="settings" hidden>
    <header class="page-head"><button class="round" id="closeSettings" aria-label="Wróć"><svg class="ic"><use href="#i-back"/></svg></button><h2 id="setTitle">Ustawienia</h2></header>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden />
    <div class="page-body" id="setBody"></div>
  </div>

  <!-- Informacje o grupce / kontakcie -->
  <div class="page" id="info" hidden>
    <header class="page-head"><button class="round" id="closeInfo" aria-label="Wróć"><svg class="ic"><use href="#i-back"/></svg></button><h2 id="infoTitle">Informacje</h2></header>
    <div class="page-body" id="infoBody"></div>
  </div>

  <!-- Arkusz ogólny -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="round sm" id="closeSheet" aria-label="Zamknij"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <!-- Okienko z pytaniem -->
  <div class="sheet" id="ask" hidden>
    <form class="sheet-card" id="askForm">
      <div class="sheet-head"><h2 id="askTitle"></h2><button class="round sm" type="button" id="askClose" aria-label="Zamknij"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <div id="askBody"></div>
      <div class="err" id="askErr"></div>
      <button class="primary" type="submit" id="askOk">OK</button>
    </form>
  </div>

  <!-- Rozmowa -->
  <div class="call" id="call" hidden>
    <div class="tiles" id="tiles" data-n="1"></div>
    <div class="call-top"><div class="e2e"><svg class="ic"><use href="#i-lock"/></svg>Szyfrowane end-to-end</div><div class="call-name" id="callName"></div><div class="call-status" id="callStatus"></div></div>
    <video id="localVideo" class="pip" autoplay playsinline muted></video>
    <div class="call-controls">
      <button class="cbtn" id="cMute" aria-label="Wycisz"><svg class="ic"><use href="#i-mic"/></svg></button>
      <button class="cbtn" id="cCam" aria-label="Kamera"><svg class="ic"><use href="#i-video"/></svg></button>
      <button class="cbtn" id="cFlip" aria-label="Przełącz kamerę"><svg class="ic"><use href="#i-flip"/></svg></button>
      <button class="cbtn" id="cScreen" aria-label="Ekran"><svg class="ic"><use href="#i-screen"/></svg></button>
      <button class="cbtn hang" id="cHang" aria-label="Rozłącz"><svg class="ic"><use href="#i-hangup"/></svg></button>
    </div>
  </div>

  <!-- Dzwoni ktoś -->
  <div class="incoming" id="incoming" hidden>
    <div class="ring-wrap"><span class="ring"></span><span class="ring r2"></span><div id="incAvatar"></div></div>
    <div class="inc-name" id="incName"></div>
    <div class="inc-sub" id="incSub"></div>
    <div class="inc-btns">
      <button class="cbtn hang big" id="incNo" aria-label="Odrzuć"><svg class="ic"><use href="#i-hangup"/></svg></button>
      <button class="cbtn accept big" id="incYes" aria-label="Odbierz"><svg class="ic"><use href="#i-phone"/></svg></button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="peerjs.min.js"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
